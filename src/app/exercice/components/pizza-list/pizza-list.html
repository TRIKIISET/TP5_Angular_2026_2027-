<div class="container">
  <h2 class="mb-4">Liste des Pizzas</h2>
  <div class="list-group">
    @for (p of pizzas(); track p.id) {
      <app-pizza-item 
        [pizza]="p" 
  />
    } @empty {
      <div class="alert alert-info">Aucune pizza disponible dans le catalogue.</div>
    }
  </div>
</div>
