<div 
  class="list-group-item d-flex justify-content-between align-items-center"
  [class.bg-warning]="!pizza().vegetarian"
>
  <div>
    <img 
      [src]="pizza().image" 
      [alt]="pizza().name" 
      class="rounded-circle" 
    />
        <strong class="badge text-bg-dark m-4"> {{ pizza().name }}</strong>

      @if (pizza().vegetarian) {
        <span class="text-success fw-bold"> Pizza végétarienne</span>
      }
      <div>
        <button class="btn btn-link" (click)="updateDisplay()">Afficher les commentaires</button>
@if(display()){
          <ul>
          @for(comment of pizza().comments; track comment.id){
            <li>
                <app-pizza-comment [comment]="comment"
                (deleteComment)="onRemoveComment($event)"
                ></app-pizza-comment>
            </li>
          }@empty {
            <li> Aucun commentaire</li>
          }

        </ul>
}
      </div>
  </div>
    <div>
    <strong>
      Prix: {{ pizza().price |number :'2.3-3' }} DT
    </strong>
    <button class="btn btn-dark" (click)="onDeletePizza()">
      Supprimer
    </button>

    </div>

</div>
